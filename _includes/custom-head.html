{% comment %}
Custom head additions — loaded last in <head> so they override theme styles.
{% endcomment %}

<style>
/* ============================================
   Force inline math for elements we wrap in .math-inline
   This wins over any theme rules that force block display
   ============================================ */

/* MathJax v3 */
.math-inline mjx-container:not([display="true"]) {
  display: inline !important;
  margin: 0 !important;
  text-align: inherit !important;
}

/* MathJax v2 (just in case) */
.math-inline .MathJax,
.math-inline .MathJax_SVG,
.math-inline .MathJax_CHTML {
  display: inline !important;
  margin: 0 !important;
  text-align: inherit !important;
}

/* KaTeX (some themes use this) */
.math-inline .katex {
  display: inline !important;
  margin: 0 !important;
  text-align: inherit !important;
}

/* Keep display math as blocks — even if inside .math-inline */
.math-inline mjx-container[display="true"] {
  display: block !important;
  margin: .6em 0 !important;
  text-align: center !important;
}
</style>
